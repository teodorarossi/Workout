<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Teodora">
<meta name="theme-color" content="#111111">
<title>Teodora · Workout</title>
<style>
:root{--r:#C8000A;--r2:#960007;--rb:#FFF2F3;--bl:#111111;--dk:#2C2C2C;--mid:#666;--lt:#999;--ln:#E0E0E0;--bg:#F8F8F8;--wh:#FFFFFF;--gr:#1A7F3C;--gb:#F0FAF4;--am:#B45309;--ab:#FFFBEB;--nh:68px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#111;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--dk);max-width:480px;margin:0 auto;height:100vh;overflow:hidden;position:relative}
#app{height:calc(100vh - var(--nh));overflow-y:auto;-webkit-overflow-scrolling:touch}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:var(--nh);background:var(--wh);border-top:2px solid var(--r);display:flex;z-index:300;box-shadow:0 -2px 16px rgba(0,0,0,.1)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;cursor:pointer;padding:8px 0;border-top:3px solid transparent}
.nb.on{background:var(--rb);border-top-color:var(--r)}
.nb .ni{font-size:18px}.nb .nl{font-size:9px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--lt)}
.nb.on .nl{color:var(--r);font-weight:700}
.ph{background:var(--bl);padding:20px 18px 14px;position:sticky;top:0;z-index:50}
.ph .lbl{font-size:11px;color:var(--lt);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.ph h1{font-size:22px;color:#fff;font-weight:700}
.pb{padding:12px 14px 20px}
.card{background:var(--wh);border-radius:12px;border:1.5px solid var(--ln);margin-bottom:8px;overflow:hidden}
.sl{font-size:10px;font-weight:700;color:var(--r);letter-spacing:.12em;text-transform:uppercase;padding:14px 0 6px;border-bottom:1px solid #C8000A33;margin-bottom:10px}
.chip{background:var(--rb);border:1px solid var(--r);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--r);font-weight:600;display:inline-block}
.btn{border:none;border-radius:10px;padding:14px 20px;font-size:15px;font-weight:700;cursor:pointer;width:100%;letter-spacing:.02em}
.btn-r{background:var(--r);color:#fff}.btn-bl{background:var(--bl);color:#fff}.btn-g{background:var(--gr);color:#fff}
/* Session overlay */
#sov{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;bottom:var(--nh);background:var(--bg);z-index:200;overflow:hidden;transition:transform .3s ease;display:flex;flex-direction:column}
#sov.show{transform:translateX(-50%) translateY(0)}
.sovh{background:var(--bl);padding:14px 16px 10px;flex-shrink:0}
.sovh-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.back-btn{background:transparent;border:1.5px solid #555;color:#AAA;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}
.sovh-info{flex:1;text-align:center}
.sovh-sub{font-size:11px;color:#AAA;letter-spacing:.1em;text-transform:uppercase}
.sovh-title{font-size:17px;font-weight:800;color:#fff}
.save-pill{font-size:11px;font-weight:700;border-radius:20px;padding:4px 10px;background:#222;color:#888;white-space:nowrap}
.save-pill.saving{color:#F59E0B}
#sov-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* Exercise cards */
.sec{background:var(--wh);border-radius:12px;border:1.5px solid var(--ln);margin-bottom:8px;overflow:hidden}
.sec.open{border-color:var(--r)}
.sech{width:100%;background:transparent;border:none;padding:14px 16px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px}
.secbody{padding:0 14px 14px}
.exb2{width:38px;height:38px;border-radius:50%;background:var(--r);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.exi{flex:1;min-width:0}.exn{font-weight:700;font-size:15px;color:var(--bl)}.exm{font-size:11px;color:var(--lt);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Series inputs */
.sr-row{display:grid;grid-template-columns:46px 1fr 1fr 44px;gap:6px;margin-bottom:8px;align-items:center}
.srl{font-size:11px;font-weight:700;color:var(--lt);letter-spacing:.05em}
.ni{position:relative;display:flex;align-items:center}
.ni input{width:100%;border:1.5px solid var(--ln);border-radius:8px;padding:10px 28px 10px 10px;font-size:15px;font-weight:700;color:var(--dk);background:var(--bg);outline:none;text-align:center;-moz-appearance:textfield}
.ni input::-webkit-outer-spin-button,.ni input::-webkit-inner-spin-button{-webkit-appearance:none}
.ni input.filled{border-color:var(--r);background:var(--rb);color:var(--r)}
.ni input:focus{border-color:var(--bl)}
.nu{position:absolute;right:8px;font-size:10px;font-weight:700;color:var(--lt);pointer-events:none}
.sdb{width:40px;height:40px;border-radius:50%;border:2px solid var(--ln);background:transparent;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--lt);transition:all .15s}
.sdb.done{background:var(--gr);border-color:var(--gr);color:#fff}
/* Timer */
#timer-ov{position:fixed;bottom:calc(var(--nh)+16px);left:50%;transform:translateX(-50%);background:var(--bl);border-radius:20px;padding:16px 20px;z-index:400;display:flex;align-items:center;gap:16px;box-shadow:0 8px 32px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;max-width:320px;width:90%}
#timer-ov.show{opacity:1;pointer-events:auto}
#timer-svg{width:60px;height:60px;flex-shrink:0}
.timer-info{flex:1}
#timer-label{font-size:11px;color:#AAA;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
#tn{font-size:32px;font-weight:900;color:#fff}
#timer-skip{background:transparent;border:1.5px solid #444;color:#AAA;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer}
/* PR banner */
#prb{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:linear-gradient(135deg,#FFD700,#FFA500);border-radius:14px;padding:12px 20px;z-index:500;text-align:center;transition:transform .4s cubic-bezier(.175,.885,.32,1.275);box-shadow:0 8px 32px rgba(255,165,0,.4);max-width:320px;width:90%}
#prb.show{transform:translateX(-50%) translateY(0)}
#prb-text{font-size:15px;font-weight:800;color:#1A1000}
/* Celebration */
#cel{position:fixed;inset:0;background:var(--bl);z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s}
#cel.show{opacity:1;pointer-events:auto}
.cel-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;margin-bottom:20px}
.cel-stat{background:#1A1A1A;border-radius:12px;padding:14px 10px;text-align:center}
.cel-val{font-size:22px;font-weight:900;color:#fff;margin-bottom:4px}
.cel-lbl{font-size:9px;font-weight:700;color:#666;letter-spacing:.1em;text-transform:uppercase}
#cnv{position:fixed;inset:0;z-index:599;pointer-events:none}
/* Exercise picker */
#expicker{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:350;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
#expicker.show{opacity:1;pointer-events:auto}
#expicker-inner{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:480px;margin:0 auto;max-height:82vh;display:flex;flex-direction:column}
#ep-head{padding:14px 16px 0;flex-shrink:0}
#ep-head input{width:100%;border:1.5px solid var(--ln);border-radius:10px;padding:10px 14px;font-size:15px;outline:none;background:var(--wh);margin-bottom:8px}
#ep-cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;flex-shrink:0}
#ep-cats::-webkit-scrollbar{display:none}
#expicker-list{overflow-y:auto;flex:1;padding-bottom:20px}
.ep-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--ln);cursor:pointer;background:var(--wh)}
.ep-item:active{background:var(--rb)}
.ep-cat-hdr{font-size:10px;font-weight:700;color:var(--lt);letter-spacing:.12em;text-transform:uppercase;padding:10px 16px 4px;background:var(--bg);border-bottom:1px solid var(--ln)}
/* Note chips */
.note-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.note-chip{border:1.5px solid var(--ln);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--mid);cursor:pointer;background:transparent;white-space:nowrap}
.note-chip.on{border-color:var(--r);background:var(--rb);color:var(--r)}
.note-chip.pos.on{border-color:var(--gr);background:var(--gb);color:var(--gr)}
/* Plank stopwatch */
#plank-sw{background:var(--bl);border-radius:12px;padding:14px;margin-bottom:10px;text-align:center}
.sw-time{font-size:42px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.sw-btns{display:flex;gap:8px;justify-content:center;margin-top:10px}
.sw-btns button{flex:1;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:700;cursor:pointer}
/* Stretch */
.stretch-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.stretch-item:last-child{border-bottom:none}
/* Wellbeing */
.wb-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.wb-label{font-size:13px;font-weight:600;color:var(--dk);width:100px;flex-shrink:0}
.wb-slider{flex:1;accent-color:var(--r)}
.wb-val{font-size:13px;font-weight:700;color:var(--r);width:20px;text-align:right}
/* Muscle chips */
.muscle-chip{background:#F0F0F0;border:1px solid var(--ln);border-radius:12px;padding:3px 9px;font-size:11px;font-weight:600;color:var(--mid);display:inline-block;margin:2px}
/* Body */
.mr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.ml{flex:1;font-size:14px;font-weight:600;color:var(--dk)}
.mv{width:80px;border:1.5px solid var(--ln);border-radius:8px;padding:7px 10px;font-size:14px;font-weight:700;text-align:center;outline:none;background:var(--bg)}
.mu{font-size:11px;color:var(--lt);width:28px}
/* Bar charts */
.barchart-wrap{display:flex;align-items:flex-end;gap:4px;height:52px;overflow-x:auto;padding-bottom:2px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;min-width:24px}
.bar-val{font-size:8px;font-weight:700;color:var(--lt)}
.bar-body{background:var(--ln);border-radius:3px 3px 0 0;width:18px;min-height:4px}
.bar-body.last{background:var(--r)}
/* Cardio inputs */
.tm-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.tm-cell{display:flex;flex-direction:column;gap:4px}
.tm-cell label{font-size:10px;font-weight:700;color:var(--lt);letter-spacing:.08em;text-transform:uppercase}
.tm-cell input,.tm-cell select{border:1.5px solid var(--ln);border-radius:8px;padding:9px 10px;font-size:14px;font-weight:700;text-align:center;outline:none;background:var(--bg);width:100%}
/* Photo */
.pp{background:var(--wh);border-radius:12px;border:1.5px solid var(--ln);padding:16px;margin-bottom:12px}
.pp h3{font-size:16px;font-weight:700;margin-bottom:6px}
.pp p{font-size:13px;color:var(--mid);line-height:1.55;margin-bottom:12px}
.pp-prev{width:100%;border-radius:10px;display:none;margin-bottom:10px}
.pp-prev.show{display:block}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
/* Remove confirm inline */
.rm-btn{background:transparent;border:none;border-left:1px solid var(--ln);color:var(--lt);font-size:18px;cursor:pointer;padding:0 14px;flex-shrink:0;transition:background .15s,color .15s}
.rm-btn.confirming{background:var(--r);color:#fff;border-left-color:var(--r2);font-size:11px;font-weight:700;letter-spacing:-.01em;padding:0 8px;min-width:58px}
/* In-progress nav dot */
.nb{position:relative}
.nb-dot{width:7px;height:7px;border-radius:50%;background:var(--r);position:absolute;top:7px;right:8px;border:1.5px solid #fff}
/* Recap */
.recap-card{background:var(--wh);border-radius:12px;border:1.5px solid var(--ln);margin-bottom:12px;overflow:hidden}
.recap-head{background:var(--bl);padding:12px 16px}
.recap-ex{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--ln)}
.recap-ex:last-child{border-bottom:none}
.recap-delta{font-size:11px;font-weight:700;border-radius:8px;padding:2px 7px;white-space:nowrap}
/* Template */
.tpl-btn{width:100%;background:var(--bg);border:1.5px dashed var(--r);border-radius:10px;padding:12px;font-size:13px;font-weight:700;color:var(--r);cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:6px}
/* Reorder handles */
.ex-handle{background:transparent;border:none;color:var(--lt);cursor:grab;font-size:16px;padding:0 10px;display:flex;flex-direction:column;gap:1px;align-items:center;justify-content:center;flex-shrink:0;touch-action:none}
.ex-handle:active{cursor:grabbing}
.handle-dot{width:3px;height:3px;border-radius:50%;background:var(--lt);display:block}
/* PR badge in exercise */
.pr-badge{background:#1A1000;border:1px solid #FFD700;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;color:#FFD700;display:inline-flex;align-items:center;gap:4px;margin-bottom:8px}
/* Wellbeing sparkline */
.wb-chart{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:6px}
.wb-bar{border-radius:3px 3px 0 0;flex:1;min-width:0;transition:height .2s}
.wb-label{font-size:9px;text-align:center;color:var(--lt);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav">
  <button class="nb on" id="nb-workout" onclick="goTab('workout')"><span class="ni">🏋️</span><span class="nl">Workout</span></button>
  <button class="nb" id="nb-recap" onclick="goTab('recap')"><span class="ni">📋</span><span class="nl">Recap</span></button>
  <button class="nb" id="nb-progress" onclick="goTab('progress')"><span class="ni">📈</span><span class="nl">Progress</span></button>
  <button class="nb" id="nb-body" onclick="goTab('body')"><span class="ni">📊</span><span class="nl">Body</span></button>
  <button class="nb" id="nb-notes" onclick="goTab('notes')"><span class="ni">📝</span><span class="nl">Notes</span></button>
</nav>

<!-- Session Overlay -->
<div id="sov">
  <div class="sovh" id="sovh-content"></div>
  <div id="sov-body"></div>
</div>

<!-- Exercise Picker -->
<div id="expicker">
  <div id="expicker-inner">
    <div id="ep-head">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:16px;font-weight:800;color:var(--bl)">Add Exercise</span>
        <button onclick="closeExPicker()" style="background:transparent;border:none;font-size:22px;cursor:pointer;color:var(--lt)">✕</button>
      </div>
      <input id="ep-q" type="text" placeholder="Search…" oninput="filterExPicker(this.value)" autocomplete="off">
      <div id="ep-cats"></div>
    </div>
    <div id="expicker-list"></div>
  </div>
</div>

<!-- Timer -->
<div id="timer-ov">
  <svg id="timer-svg" viewBox="0 0 60 60">
    <circle cx="30" cy="30" r="26" fill="none" stroke="#333" stroke-width="5"/>
    <circle id="tpg" cx="30" cy="30" r="26" fill="none" stroke="var(--r)" stroke-width="5" stroke-linecap="round" transform="rotate(-90 30 30)" stroke-dasharray="163" stroke-dashoffset="0"/>
  </svg>
  <div class="timer-info"><div id="timer-label">REST</div><div id="tn">90</div></div>
  <button id="timer-skip" onclick="skipTimer()">Skip</button>
</div>

<!-- PR Banner -->
<div id="prb"><div id="prb-text"></div></div>

<!-- Confetti + Celebration -->
<canvas id="cnv"></canvas>
<div id="cel">
  <div id="cel-title" style="font-size:30px;font-weight:900;color:#fff;margin-bottom:6px"></div>
  <div id="cel-sub" style="font-size:14px;color:#AAA;margin-bottom:20px"></div>
  <div class="cel-stats">
    <div class="cel-stat"><div class="cel-val" id="cv1"></div><div class="cel-lbl">Duration</div></div>
    <div class="cel-stat"><div class="cel-val" id="cv2"></div><div class="cel-lbl">Volume</div></div>
    <div class="cel-stat"><div class="cel-val" id="cv3" style="color:#FFD700"></div><div class="cel-lbl">New PRs</div></div>
  </div>
  <div id="cel-muscles" style="width:100%;margin-bottom:16px;text-align:center"></div>
  <div id="cel-prs" style="width:100%;margin-bottom:18px"></div>
  <div id="cel-msg" style="font-size:14px;color:#AAA;line-height:1.65;margin-bottom:24px;max-width:280px"></div>
  <button class="btn btn-r" onclick="closeCelebration()" style="max-width:280px">Continue →</button>
</div>

<!-- Hidden inputs -->
<input type="file" id="photo-input" accept="image/*" style="display:none" onchange="handlePhoto(this)">
<input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(this)">

<script>
/* ═══════════════════════════════════════════════
   EXERCISE DATABASE
═══════════════════════════════════════════════ */
const EXERCISES = [
  // LOWER BODY
  {id:'leg_press',      emoji:'🦵', name:'Leg Press',             cat:'Lower Body', type:'machine',    muscles:['Quads','Glutes','Hamstrings'],
   tip:'Never lock knees at the top.', steps:['Back fully flat against pad','Feet shoulder-width, middle of platform','Push explosively exhaling — 2 sec up','Return slowly — 3 sec down, no bouncing']},
  {id:'abductor',       emoji:'↔️', name:'Hip Abductor',          cat:'Lower Body', type:'machine',    muscles:['Glute Med','Outer Glute','Hip Stabilizers'],
   tip:'Feel the work on the outer glute, not the front thigh.', steps:['Open legs slowly outward — 2 sec','Hold at end range 1 sec','Return controlled — never release suddenly']},
  {id:'adductor',       emoji:'↔️', name:'Hip Adductor',          cat:'Lower Body', type:'machine',    muscles:['Inner Thigh','Groin','Adductors'],
   tip:'Keep torso upright throughout.', steps:['Close legs slowly inward','Control the return','Squeeze at top for 1 sec']},
  {id:'stand_abductor', emoji:'🦶', name:'Standing Abductor',     cat:'Lower Body', type:'machine',    muscles:['Glute Med','Hip Stabilizers'],
   tip:'Keep torso still — no leaning.', steps:['Stand upright, kick leg outward','Control the return','Squeeze glute at top']},
  {id:'rear_kick',      emoji:'🍑', name:'Rear Kick',             cat:'Lower Body', type:'machine',    muscles:['Glutes','Hamstrings'],
   tip:'Log reps as dx/sx (each leg separately).', steps:['Extend leg straight back','Squeeze glute fully at top','Return controlled — 3 sec','Alternate legs or complete all reps one side then switch']},
  {id:'leg_curl',       emoji:'🦿', name:'Leg Curl',              cat:'Lower Body', type:'machine',    muscles:['Hamstrings'],
   tip:'Slow eccentric (return) builds more muscle than the curl itself.', steps:['Lie face down or seated','Curl heels toward glutes — 2 sec','Return slowly — 3 sec, full extension']},
  {id:'leg_ext',        emoji:'🦿', name:'Leg Extension',         cat:'Lower Body', type:'machine',    muscles:['Quadriceps'],
   tip:'Do not lock knees — stop just short of full extension.', steps:['Sit upright, pads on shins','Extend legs fully — 2 sec','Lower slowly — 3 sec, no momentum']},
  {id:'hip_thrust',     emoji:'🏋️', name:'Hip Thrust',            cat:'Lower Body', type:'machine',    muscles:['Glutes','Hamstrings','Hip Extensors'],
   tip:'Full hip extension at the top — squeeze hard.', steps:['Upper back on bench or pad','Drive hips upward — 2 sec','Squeeze glutes at top, hold 1 sec','Lower controlled']},
  {id:'calf_raise',     emoji:'🦵', name:'Calf Raise',            cat:'Lower Body', type:'machine',    muscles:['Calves','Soleus'],
   tip:'Full range: heel drops below platform at bottom for maximum stretch.', steps:['Toes on platform edge','Rise on toes fully — 2 sec','Hold at top 1 sec','Lower heel below platform — 3 sec']},
  {id:'smith_squat',    emoji:'🏋️', name:'Smith Machine Squat',   cat:'Lower Body', type:'machine',    muscles:['Quads','Glutes','Hamstrings'],
   tip:'Find foot position before loading — squat slow first.', steps:['Bar on shoulders, feet shoulder-width','Descend until thighs parallel — 3 sec','Back straight, chest up, eyes forward','Drive through heels to stand — 2 sec, exhale']},
  {id:'rdl',            emoji:'🏗️', name:'Romanian Deadlift',     cat:'Lower Body', type:'cable',      muscles:['Hamstrings','Glutes','Erectors'],
   tip:'Stop when you feel the hamstring stretch — not lower.', steps:['Stand tall, slight knee bend','Hinge at hips, back STRAIGHT — not rounded','Descend until hamstring stretch is felt','Drive hips forward to return — do not pull with back']},
  {id:'hack_squat',     emoji:'📐', name:'Hack Squat',            cat:'Lower Body', type:'machine',    muscles:['Quads','Glutes'],
   tip:'Knees track over toes throughout.', steps:['Shoulders under pads, feet shoulder-width','Descend slowly — 3 sec, thighs parallel','Push through heels to return — 2 sec']},
  // PUSH

/* ═══════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════ */
function today(){ return new Date().toISOString().split('T')[0]; }
function fmtDate(d){ if(!d)return ''; try{return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});}catch{return d;} }
function fmtDur(ms){ if(!ms||ms<1000)return '--'; const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000); return s>0?m+'m '+s+'s':m+'m'; }
function age(){ const b=new Date('1999-06-08'),n=new Date(); let a=n.getFullYear()-b.getFullYear(); if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--; return a; }
function getAllSessions(){ return Object.entries(DB.sessions).map(([k,v])=>({key:k,...v})).filter(s=>Number.isFinite(s.num)).sort((a,b)=>a.num-b.num); }
function getCompletedSessions(){ return getAllSessions().filter(s=>s.completed); }
function nextSessNum(){ const n=getAllSessions().map(s=>s.num); return n.length?Math.max(...n)+1:1; }
function getEx(id){ return EXERCISES.find(e=>e.id===id); }
function getPRMax(exId,excludeKey){ let m=0; for(const[k,s]of Object.entries(DB.sessions)){if(k===excludeKey||!s.completed)continue; for(const set of(s.exercises?.[exId]?.sets||[])){const v=parseFloat(set.kg);if(v>m)m=v;}} return m; }
function isPR(exId,kg,excludeKey){ return parseFloat(kg)>0&&parseFloat(kg)>getPRMax(exId,excludeKey); }
function getStreak(){ const d=getCompletedSessions().map(s=>s.date).filter(Boolean); if(!d.length)return 0; const s=[...new Set(d)].sort().reverse(); let st=1,pv=s[0]; for(let i=1;i<s.length;i++){const df=(new Date(pv+'T12:00')-new Date(s[i]+'T12:00'))/86400000; if(df<=2)st++;else break;pv=s[i];} return st; }

function getMusclesSummary(exercises){
  const all=[];
  for(const exId of Object.keys(exercises||{})){
    const ex=getEx(exId);
    if(ex) ex.muscles.forEach(m=>{ if(!all.includes(m)) all.push(m); });
  }
  return all;
}

function goTab(t){
  S.tab=t;
  const sov=document.getElementById('sov');
  if(sov)sov.classList.remove('show');
  stopTimer();
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  const nb=document.getElementById('nb-'+t);if(nb)nb.classList.add('on');
  updateNavDot();
  renderApp();
}
function updateNavDot(){
  // Show red dot on workout tab if a session is in progress
  document.querySelectorAll('.nb-dot').forEach(d=>d.remove());
  const inProgress=S.sessKey&&DB.sessions[S.sessKey]&&!DB.sessions[S.sessKey].completed;
  if(inProgress){
    const nb=document.getElementById('nb-workout');
    if(nb){const dot=document.createElement('span');dot.className='nb-dot';nb.appendChild(dot);}
  }
}
function renderApp(){
  const app=document.getElementById('app');
  if(S.tab==='workout') app.innerHTML=renderWorkout();
  else if(S.tab==='recap') app.innerHTML=renderRecap();
  else if(S.tab==='progress') app.innerHTML=renderProgress();
  else if(S.tab==='body') app.innerHTML=renderBody();
  else if(S.tab==='notes') app.innerHTML=renderNotes();
  updateNavDot();
}

  if(inProg){
    const sd=DB.sessions[S.sessKey];

function renderWorkout(){
  const done=getCompletedSessions();
  const nextNum=nextSessNum();
  const last=done.length?done[done.length-1]:null;
  const daysSince=last?Math.floor((Date.now()-new Date(last.date+'T12:00:00'))/86400000):null;

  let statusMsg='', statusColor='var(--mid)';
  if(daysSince===null){ statusMsg='Ready to start your journey? Your first session awaits.'; }
  else if(daysSince===0){ statusMsg='Great session today! Rest well — recovery is part of training.'; statusColor='var(--gr)'; }
  else if(daysSince===1){ statusMsg='Rest day — your muscles are growing. Back tomorrow!'; statusColor='var(--am)'; }
  else if(daysSince===2){ statusMsg='Two days off — energy restored. Perfect time to train.'; statusColor='var(--am)'; }
  else { statusMsg='It\'s been '+daysSince+' days since your last session. Let\'s go!'; statusColor='var(--r)'; }

  const totalVol=done.reduce((acc,s)=>{for(const ed of Object.values(s.exercises||{}))for(const set of(ed.sets||[]))acc+=(parseFloat(set.kg)||0)*(parseFloat(set.reps)||0);return acc;},0);

  let h=`<div class="ph"><div class="lbl">Teodora · ${age()} · Workout</div><h1>Session ${nextNum}</h1></div>
  <div class="pb">
  <div style="background:var(--wh);border-radius:14px;border:1.5px solid var(--ln);padding:16px;margin-bottom:10px">
    <p style="font-size:14px;color:${statusColor};margin-bottom:4px;font-weight:600">${statusMsg}</p>
    <p style="font-size:12px;color:var(--lt);font-style:italic;margin-bottom:16px">"${getQuote()}"</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">
      <div style="background:var(--bl);border-radius:8px;padding:8px 6px;text-align:center"><div style="font-size:9px;color:#AAA;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px">Sessions</div><div style="color:#fff;font-weight:700;font-size:16px">${done.length}</div></div>
      <div style="background:var(--bl);border-radius:8px;padding:8px 6px;text-align:center"><div style="font-size:9px;color:#AAA;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px">Volume</div><div style="color:#fff;font-weight:700;font-size:14px">${totalVol>0?Math.round(totalVol/1000)+'k':'—'} kg</div></div>
      <div style="background:var(--bl);border-radius:8px;padding:8px 6px;text-align:center"><div style="font-size:9px;color:#AAA;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px">Streak</div><div style="color:#fff;font-weight:700;font-size:16px">${getStreak()} 🔥</div></div>
    </div>
    <button class="btn btn-r" onclick="startNewSession(false)" style="font-size:17px;padding:18px;border-radius:12px;margin-bottom:8px">Start Session ${nextNum} →</button>
    ${renderWorkoutSecondaryBtn()}
  </div>`;

  // Last session recap strip
  if(last){
    const muscles=getMusclesSummary(last.exercises||{});
    const exNames=Object.keys(last.exercises||{}).map(id=>getEx(id)?.name||id).slice(0,4).join(', ');
    h+=`<div style="background:var(--wh);border-radius:12px;border:1.5px solid var(--ln);padding:12px 14px;margin-bottom:10px">
      <div style="font-size:10px;font-weight:700;color:var(--lt);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px">LAST SESSION — ${fmtDate(last.date)} · Session ${last.num}</div>
      <div style="font-size:13px;color:var(--dk);margin-bottom:6px">${exNames}${Object.keys(last.exercises||{}).length>4?'…':''}</div>
      <div style="display:flex;flex-wrap:wrap;gap:3px">${muscles.slice(0,6).map(m=>`<span class="muscle-chip">${m}</span>`).join('')}</div>
    </div>`;
  }

  // Exercise guide
  h+=`<div style="background:var(--wh);border-radius:12px;border:1.5px solid var(--ln);overflow:hidden;margin-bottom:8px">
    <button onclick="S.guideOpen=!S.guideOpen;renderApp()" style="width:100%;background:transparent;border:none;padding:14px 16px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px">
      <div style="width:38px;height:38px;border-radius:50%;background:var(--bl);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">📖</div>
      <div style="flex:1"><div style="font-weight:700;font-size:15px;color:var(--bl)">Exercise Guide</div><div style="font-size:11px;color:var(--lt);margin-top:1px">${EXERCISES.length} exercises · technique & tips</div></div>
      <span style="color:var(--lt);font-size:16px">${S.guideOpen?'▲':'▼'}</span>
    </button>`;
  if(S.guideOpen){
    h+=`<div style="padding:0 14px;border-top:1px solid var(--ln)">
      <input type="text" value="${S.guideQ||''}" placeholder="Search…" oninput="S.guideQ=this.value;renderApp()" style="width:100%;border:1.5px solid var(--ln);border-radius:8px;padding:9px 12px;font-size:14px;outline:none;background:var(--bg);margin:10px 0 8px">

    h+=`</div>`;
    const q=(S.guideQ||'').toLowerCase();
    EXERCISES.filter(ex=>(S.guideCat==='All'||ex.cat===S.guideCat)&&(!q||ex.name.toLowerCase().includes(q)||ex.muscles.join(' ').toLowerCase().includes(q))).forEach(ex=>{
      h+=`<div class="card" style="margin-bottom:6px">
        <div style="padding:10px 12px">

          ${ex.tip?`<div style="background:var(--ab);border-radius:6px;padding:6px 10px;margin-top:6px;font-size:12px;color:var(--am)">💡 ${ex.tip}</div>`:''}
        </div>

    });
    h+=`</div>`;

  h+=`</div></div>`;
  return h;

/* ═══════════════════════════════════════════════
   SESSION MANAGEMENT
═══════════════════════════════════════════════ */
function startNewSession(useTemplate){
  const num=nextSessNum();
  const key='s'+num;
  DB.sessions[key]={num,date:today(),timeOfDay:'morning',startTime:Date.now(),duration:null,completed:false,checkin:null,exercises:{},stretch:{}};
  // Load exercises from last session as template
  if(useTemplate){
    const done=getCompletedSessions();
    const last=done.length?done[done.length-1]:null;
    if(last&&last.exercises){
      Object.keys(last.exercises).forEach(exId=>{
        DB.sessions[key].exercises[exId]={sets:[]};
      });
    }
  }
  saveDB();
  S.sessKey=key; S.sessStep='checkin';
  S.openSessEx=new Set(); S.doneSeries={};
  S.photoData=null; S.photoCaption='';
  S.sessionStart=Date.now();
  S.wbDraft={energy:3,sleep:3,stress:3,mood:3,pain:false,painNote:''};
  S.plankSW=null;
  renderSOV();
  document.getElementById('sov').classList.add('show');
}
function resumeSession(){
  if(!S.sessKey||!DB.sessions[S.sessKey])return;
  S.sessStep='exercises';
  renderSOV();
  document.getElementById('sov').classList.add('show');
}
function openExistingSession(key){
  S.sessKey=key; S.sessStep='start';
  S.openSessEx=new Set(); S.doneSeries={};
  S.photoData=null; S.photoCaption='';
  S.plankSW=null;
  const sd=DB.sessions[key]||{};
  S.sessionStart=sd.startTime||null;
  renderSOV();
  document.getElementById('sov').classList.add('show');
}
function closeSession(){
  document.getElementById('sov').classList.remove('show');
  stopTimer(); renderApp();
}
function confirmCancel(){
  const sd=DB.sessions[S.sessKey]||{};
  if(sd.completed){closeSession();return;}
  const hasData=sd.exercises&&Object.keys(sd.exercises).some(k=>{const ed=sd.exercises[k];return(ed.sets&&ed.sets.some(s=>s.kg||s.reps||s.sec))||(ed.cardio&&Object.values(ed.cardio).some(v=>v));});
  if(hasData){if(confirm('Close session? Your data is saved.'))closeSession();}
  else{delete DB.sessions[S.sessKey];saveDB();closeSession();}
}

function saveCheckin(){

  S.sessStep='exercises';
  renderSOV(); triggerSave();
}

/* ═══════════════════════════════════════════════
   SESSION START / SUMMARY
═══════════════════════════════════════════════ */
function renderSessStart(sd){
  if(sd.completed){
    let vol=0,prCount=0;
    for(const[exId,ed]of Object.entries(sd.exercises||{})){
      for(const set of(ed.sets||[])){
        vol+=(parseFloat(set.kg)||0)*(parseFloat(set.reps)||0);
        if(set.kg&&isPR(exId,set.kg,S.sessKey))prCount++;
      }
    }
    const muscles=getMusclesSummary(sd.exercises||{});
    const ci=sd.checkin;
    return `<div style="padding:18px 16px">
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-size:44px;margin-bottom:6px">✅</div>
        <h2 style="font-size:21px;font-weight:900;color:var(--bl)">Session ${sd.num} Complete</h2>
        <p style="font-size:13px;color:var(--lt);margin-top:4px">${fmtDate(sd.date)}${sd.duration?' · '+fmtDur(sd.duration):''}</p>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
        <div style="background:var(--bl);border-radius:10px;padding:12px;text-align:center"><div style="font-size:18px;font-weight:900;color:#fff">${Math.round(vol)||'—'}</div><div style="font-size:9px;color:#888;text-transform:uppercase;letter-spacing:.1em;margin-top:2px">kg×reps vol</div></div>
        <div style="background:var(--bl);border-radius:10px;padding:12px;text-align:center"><div style="font-size:18px;font-weight:900;color:${prCount?'#FFD700':'#fff'}">${prCount||'—'}</div><div style="font-size:9px;color:#888;text-transform:uppercase;letter-spacing:.1em;margin-top:2px">new PRs 🏆</div></div>
      </div>
      ${muscles.length?`<div style="margin-bottom:12px"><div style="font-size:10px;font-weight:700;color:var(--lt);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px">MUSCLES TRAINED</div><div>${muscles.map(m=>`<span class="muscle-chip">${m}</span>`).join('')}</div></div>`:''}
      ${ci?`<div style="background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--mid)"><span style="font-weight:700;color:var(--lt)">PRE-TRAINING: </span>Energy ${ci.energy}/5 · Sleep ${ci.sleep}/5 · Mood ${ci.mood}/5${ci.pain?' · ⚠️ '+ci.painNote:''}</div>`:''}
      <button class="btn btn-bl" onclick="S.sessStep='exercises';renderSOV()" style="margin-bottom:10px">Edit Log →</button>
      <button onclick="deleteSession(S.sessKey)" style="width:100%;background:transparent;border:1.5px solid var(--r);color:var(--r);border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer">Delete Session</button>
    </div>`;
  }
  return `<div style="padding:24px 16px;text-align:center">
    <p style="font-size:15px;color:var(--mid);margin-bottom:20px">Session ${sd.num} — tap below to start logging</p>
    <button class="btn btn-r" onclick="S.sessStep='exercises';renderSOV()">Start Logging →</button>
  </div>`;
}

/* ═══════════════════════════════════════════════
   SESSION EXERCISES VIEW
═══════════════════════════════════════════════ */
function renderSessExs(sd){
  // Use stored order if present, else derive from object keys
  if(!sd.exOrder) sd.exOrder=Object.keys(sd.exercises||{});
  // Ensure all existing exercises are in order (handles newly added ones)
  const existing=Object.keys(sd.exercises||{});
  existing.forEach(id=>{if(!sd.exOrder.includes(id))sd.exOrder.push(id);});
  // Remove deleted ones
  sd.exOrder=sd.exOrder.filter(id=>existing.includes(id));

  let h=`<div style="padding:12px 14px 20px">`;
  sd.exOrder.forEach((exId,idx)=>{
    h+=renderSessExCard(exId,sd,idx,sd.exOrder.length);
  });
  h+=`<button onclick="openExPicker()" style="width:100%;background:transparent;border:2px dashed var(--ln);border-radius:12px;padding:14px;font-size:14px;font-weight:700;color:var(--mid);cursor:pointer;margin-bottom:12px">+ Add Exercise</button>`;
  h+=renderStretchSection(sd);
  h+=`<button class="btn btn-r" onclick="finishSession()" style="font-size:16px;padding:16px">Finish Session ✓</button></div>`;
  return h;
}

function renderSessExCard(exId,sd,idx,total){
  const ex=getEx(exId);
  const name=ex?ex.name:exId;
  const ed=sd.exercises[exId]||{sets:[]};
  const isOpen=S.openSessEx.has(exId);
  const hasData=(ed.sets||[]).some(s=>s.kg||s.reps||s.sec)||(ed.cardio&&Object.values(ed.cardio).some(v=>v));
  const isCardio=ex?.type==='cardio';
  const isPlank=exId==='plank'||exId==='plank_side';
  const isBilateral=exId==='rear_kick';

  // PR info for this exercise
  const prMax=getPRMax(exId,S.sessKey);
  const plankPRMax=getPRMaxSec(exId,S.sessKey);

  let inner='';
  if(isOpen){
    // PR badge at top of expanded card
    let prBadge='';
    if(isPlank&&plankPRMax>0) prBadge=`<div style="padding:0 14px 6px"><div class="pr-badge">🏆 Your best: ${plankPRMax}s</div></div>`;
    else if(!isCardio&&!isPlank&&prMax>0) prBadge=`<div style="padding:0 14px 6px"><div class="pr-badge">🏆 Your best: ${prMax}kg</div></div>`;

    if(isCardio) inner=prBadge+renderCardioInputs(exId,ed);
    else if(isPlank) inner=prBadge+renderPlankInputs(exId,ed);
    else inner=prBadge+renderSetsInputs(exId,ed,ex,isBilateral);
  }

  // Move up/down buttons (only show if more than 1 exercise)
  const moveButtons=(total>1)?`<div style="display:flex;flex-direction:column;gap:1px;padding:0 6px;justify-content:center;flex-shrink:0">
    <button onclick="moveEx('${exId}',-1)" style="background:transparent;border:none;cursor:pointer;color:${idx===0?'#DDD':'var(--lt)'};font-size:12px;padding:2px 4px;line-height:1" ${idx===0?'disabled':''}>▲</button>
    <button onclick="moveEx('${exId}',1)" style="background:transparent;border:none;cursor:pointer;color:${idx===total-1?'#DDD':'var(--lt)'};font-size:12px;padding:2px 4px;line-height:1" ${idx===total-1?'disabled':''}>▼</button>
  </div>`:'';

  return `<div class="sec ${isOpen?'open':''}" id="sec-${exId}" style="margin-bottom:8px">
    <div style="display:flex;align-items:stretch">
      ${moveButtons}
      <button class="sech" onclick="togSessEx('${exId}')" style="flex:1;min-width:0;border:none;background:transparent;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 10px 12px 4px">
        <div class="exb2" style="${hasData?'background:var(--gr)':''}${ex?'':';background:#555;font-size:14px'}">${ex?(ex.emoji||ex.cat.slice(0,3)):'?'}</div>
        <div class="exi"><div class="exn">${name}</div><div class="exm">${ex?ex.muscles.slice(0,2).join(' · '):'Custom'}</div></div>
        ${hasData?'<span style="font-size:12px;color:var(--gr);font-weight:700;margin-right:4px">✓</span>':''}
        <span style="color:var(--lt);font-size:14px;flex-shrink:0">${isOpen?'▲':'▼'}</span>
      </button>
      <button class="rm-btn" id="rm-${exId}" onclick="tapRemove('${exId}',this)">✕</button>
    </div>
    ${inner}
  </div>`;
}

function renderCardioInputs(exId,ed){
  const c=ed.cardio||{};
  return `<div class="secbody">
    <div class="tm-row">
      <div class="tm-cell"><label>Speed km/h</label><input type="number" inputmode="decimal" step="0.1" value="${c.speed||''}" placeholder="—" onchange="updCardio('${exId}','speed',this.value)"></div>
      <div class="tm-cell"><label>Incline %</label><input type="number" inputmode="numeric" step="1" value="${c.incline||''}" placeholder="—" onchange="updCardio('${exId}','incline',this.value)"></div>
      <div class="tm-cell"><label>Duration min</label><input type="number" inputmode="numeric" step="1" value="${c.duration||''}" placeholder="—" onchange="updCardio('${exId}','duration',this.value)"></div>
    </div>
    <input type="text" value="${c.notes||''}" placeholder="Notes (intervals, distance, floors…)" style="width:100%;border:1.5px solid var(--ln);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;background:var(--bg);font-family:inherit" onchange="updCardio('${exId}','notes',this.value)">
  </div>`;
}

function renderPlankInputs(exId,ed){
  const sets=ed.sets||[];
  const sw=S.plankSW||{running:false,elapsed:0};
  const fmtSW=s=>{const m=Math.floor(s/60),sc=s%60;return m>0?(m+'m '+String(sc).padStart(2,'0')+'s'):(String(sc)+'s');};
  const numSets=Math.max(sets.length,3);
  let rows='';
  for(let i=0;i<numSets;i++){
    const set=sets[i]||{};
    const done=S.doneSeries[exId]?.[i]||false;
    rows+=`<div style="display:grid;grid-template-columns:46px 1fr 44px;gap:6px;margin-bottom:8px;align-items:center">
      <div class="srl">Set ${i+1}</div>
      <div class="ni"><input type="number" inputmode="numeric" min="0" step="5" value="${set.sec||''}" placeholder="— sec" class="${set.sec?'filled':''}" onchange="updSet('${exId}',${i},'sec',this.value)" oninput="this.classList.toggle('filled',!!this.value)"><span class="nu">sec</span></div>
      <button class="sdb ${done?'done':''}" onclick="markDone('${exId}',${i},60)">${done?'✓':'○'}</button>
    </div>`;
  }
  return `<div class="secbody">
    <div id="plank-sw">
      <div class="sw-time" id="sw-display">${fmtSW(sw.elapsed||0)}</div>
      <div class="sw-btns">
        <button onclick="swStart()" style="background:var(--r);color:#fff">${sw.running?'Running…':'▶ Start'}</button>
        <button onclick="swStop('${exId}')" style="background:#333;color:#EEE">⏹ Save</button>
        <button onclick="swReset()" style="background:#222;color:#666">↺ Reset</button>
      </div>
    </div>
    <div style="font-size:11px;color:var(--lt);text-align:center;margin-bottom:10px">Start → hold → Stop & Save → logged automatically</div>
    ${rows}
    <button onclick="addSet('${exId}')" style="width:100%;background:transparent;border:1px dashed var(--ln);border-radius:8px;padding:8px;font-size:13px;color:var(--mid);cursor:pointer">+ Add Set</button>
  </div>`;
}

const NOTE_CHIPS_POS=['too easy','felt strong','increase next time','perfect weight'];
const NOTE_CHIPS_NEG=['too heavy','felt pain','incomplete'];
function renderSetsInputs(exId,ed,ex,bilateral){
  const sets=ed.sets||[];
  const done2=getCompletedSessions();
  const prev=[...done2].reverse().find(s=>s.exercises?.[exId]?.sets?.length);
  const prevSets=prev?.exercises?.[exId]?.sets||[];
  const activeChips=ed.chips?ed.chips.split(',').filter(Boolean):[];
  const numSets=Math.max(sets.length,3);
  let rows='';

  if(bilateral){
    const hdr=`<div style="display:grid;grid-template-columns:46px 60px 1fr 1fr 44px;gap:5px;margin-bottom:6px"><div></div><div style="text-align:center;font-size:10px;font-weight:700;color:var(--mid)">KG</div><div style="text-align:center;font-size:10px;font-weight:700;color:var(--mid)">DX</div><div style="text-align:center;font-size:10px;font-weight:700;color:var(--mid)">SX</div><div></div></div>`;
    for(let i=0;i<numSets;i++){
      const set=sets[i]||{};const dn=S.doneSeries[exId]?.[i]||false;const ps=prevSets[i]||{};
      rows+=`<div style="display:grid;grid-template-columns:46px 60px 1fr 1fr 44px;gap:5px;margin-bottom:8px;align-items:center">
        <div class="srl">Set ${i+1}</div>
        <div class="ni"><input type="number" inputmode="decimal" min="0" step="0.5" value="${set.kg||''}" placeholder="${ps.kg||'—'}" class="${set.kg?'filled':''}" onchange="updSet('${exId}',${i},'kg',this.value)" oninput="this.classList.toggle('filled',!!this.value)"><span class="nu">kg</span></div>
        <div class="ni"><input type="number" inputmode="numeric" min="0" step="1" value="${set.rdx||''}" placeholder="${ps.rdx||'—'}" class="${set.rdx?'filled':''}" onchange="updSet('${exId}',${i},'rdx',this.value)" oninput="this.classList.toggle('filled',!!this.value)"><span class="nu">dx</span></div>
        <div class="ni"><input type="number" inputmode="numeric" min="0" step="1" value="${set.rsx||''}" placeholder="${ps.rsx||'—'}" class="${set.rsx?'filled':''}" onchange="updSet('${exId}',${i},'rsx',this.value)" oninput="this.classList.toggle('filled',!!this.value)"><span class="nu">sx</span></div>
        <button class="sdb ${dn?'done':''}" onclick="markDone('${exId}',${i},90)">${dn?'✓':'○'}</button>
      </div>`;
    }
    rows=hdr+rows;
  } else {
    rows+=`<div style="display:grid;grid-template-columns:46px 1fr 1fr 44px;gap:6px;margin-bottom:6px"><div></div><div style="text-align:center;font-size:10px;font-weight:700;color:var(--mid)">KG</div><div style="text-align:center;font-size:10px;font-weight:700;color:var(--mid)">REPS</div><div></div></div>`;
    for(let i=0;i<numSets;i++){
      const set=sets[i]||{};const dn=S.doneSeries[exId]?.[i]||false;const ps=prevSets[i]||{};
      rows+=`<div class="sr-row">
        <div class="srl">Set ${i+1}</div>
        <div class="ni"><input type="number" inputmode="decimal" min="0" step="0.5" value="${set.kg||''}" placeholder="${ps.kg||'—'}" class="${set.kg?'filled':''}" onchange="updSet('${exId}',${i},'kg',this.value)" oninput="this.classList.toggle('filled',!!this.value)"><span class="nu">kg</span></div>
        <div class="ni"><input type="number" inputmode="numeric" min="0" step="1" value="${set.reps||''}" placeholder="${ps.reps||'—'}" class="${set.reps?'filled':''}" onchange="updSet('${exId}',${i},'reps',this.value)" oninput="this.classList.toggle('filled',!!this.value)"><span class="nu">reps</span></div>
        <button class="sdb ${dn?'done':''}" onclick="markDone('${exId}',${i},${ex?.rest||90})">${dn?'✓':'○'}</button>
      </div>`;
    }
  }

  const prevStr=prevSets.length?(bilateral?prevSets.map(s=>`${s.kg||'?'}kg·${s.rdx||'?'}dx/${s.rsx||'?'}sx`).join(' '):prevSets.map(s=>`${s.kg||'?'}×${s.reps||'?'}`).join(' · ')):'';
  return `<div class="secbody">
    ${prevStr?`<div style="background:var(--bg);border-radius:6px;padding:6px 10px;margin-bottom:10px;font-size:12px;color:var(--mid)"><span style="font-weight:700;color:var(--lt)">LAST: </span>${prevStr}</div>`:''}
    ${rows}
    <button onclick="addSet('${exId}')" style="width:100%;background:transparent;border:1px dashed var(--ln);border-radius:8px;padding:8px;font-size:13px;color:var(--mid);cursor:pointer;margin-top:4px">+ Add Set</button>
    <div style="margin-top:12px">
      <div style="font-size:10px;font-weight:700;color:var(--lt);letter-spacing:.1em;margin-bottom:6px">HOW WAS IT?</div>
      <div class="note-chips">
        ${NOTE_CHIPS_POS.map(c=>`<button class="note-chip pos ${activeChips.includes(c)?'on':''}" onclick="toggleChip('${exId}','${c}')">${c}</button>`).join('')}

function togSessEx(id){if(S.openSessEx.has(id))S.openSessEx.delete(id);else S.openSessEx.add(id);renderSOV();}
function updSet(exId,i,field,val){
  const k=S.sessKey;
  if(!DB.sessions[k].exercises[exId])DB.sessions[k].exercises[exId]={sets:[]};
  const sets=DB.sessions[k].exercises[exId].sets;
  while(sets.length<=i)sets.push({});
  sets[i][field]=val;
  if(field==='kg'&&val&&isPR(exId,val,k))showPR(exId,val);
  triggerSave();
}
function updExNote(exId,val){const k=S.sessKey;if(!DB.sessions[k].exercises[exId])DB.sessions[k].exercises[exId]={sets:[]};DB.sessions[k].exercises[exId].note=val;triggerSave();}
function updCardio(exId,field,val){const k=S.sessKey;if(!DB.sessions[k].exercises[exId])DB.sessions[k].exercises[exId]={sets:[],cardio:{}};if(!DB.sessions[k].exercises[exId].cardio)DB.sessions[k].exercises[exId].cardio={};DB.sessions[k].exercises[exId].cardio[field]=val;triggerSave();}
function addSet(exId){const k=S.sessKey;if(!DB.sessions[k].exercises[exId])DB.sessions[k].exercises[exId]={sets:[]};DB.sessions[k].exercises[exId].sets.push({});renderSOV();triggerSave();}
let _rmTimeout=null;
function tapRemove(exId,btn){
  if(btn.classList.contains('confirming')){
    // Second tap — actually remove
    clearTimeout(_rmTimeout);
    removeEx(exId);
  } else {
    // First tap — arm
    btn.classList.add('confirming');
    btn.textContent='Remove?';
    _rmTimeout=setTimeout(()=>{
      btn.classList.remove('confirming');
      btn.textContent='✕';
    },2500);
  }
}
function removeEx(exId){
  const k=S.sessKey;
  delete DB.sessions[k].exercises[exId];
  if(DB.sessions[k].exOrder) DB.sessions[k].exOrder=DB.sessions[k].exOrder.filter(id=>id!==exId);
  S.openSessEx.delete(exId);
  renderSOV();triggerSave();
}
function moveEx(exId,dir){
  const k=S.sessKey,sd=DB.sessions[k];
  if(!sd.exOrder) sd.exOrder=Object.keys(sd.exercises||{});
  const i=sd.exOrder.indexOf(exId);
  const j=i+dir;
  if(j<0||j>=sd.exOrder.length) return;
  [sd.exOrder[i],sd.exOrder[j]]=[sd.exOrder[j],sd.exOrder[i]];
  renderSOV();triggerSave();
}
function getPRMaxSec(exId,excludeKey){
  let m=0;
  for(const[k,s]of Object.entries(DB.sessions)){
    if(k===excludeKey||!s.completed)continue;
    for(const set of(s.exercises?.[exId]?.sets||[])){const v=parseFloat(set.sec);if(v>m)m=v;}
  }
  return m;
}
function markDone(exId,si,rest){
  if(!S.doneSeries[exId])S.doneSeries[exId]=[];
  S.doneSeries[exId][si]=!S.doneSeries[exId][si];
  if(S.doneSeries[exId][si])startTimer(rest);
  const btn=document.querySelectorAll('#sec-'+exId+' .sdb')[si];
  if(btn){btn.classList.toggle('done',S.doneSeries[exId][si]);btn.textContent=S.doneSeries[exId][si]?'✓':'○';}
}
function toggleChip(exId,chip){
  const k=S.sessKey;
  if(!DB.sessions[k].exercises[exId])DB.sessions[k].exercises[exId]={sets:[]};
  const ed=DB.sessions[k].exercises[exId];
  const chips=ed.chips?ed.chips.split(',').filter(Boolean):[];
  const idx=chips.indexOf(chip);
  if(idx>=0)chips.splice(idx,1);else chips.push(chip);
  ed.chips=chips.join(',');
  triggerSave();
  document.querySelectorAll('#sec-'+exId+' .note-chip').forEach(btn=>{
    const on=chips.includes(btn.textContent.trim());
    btn.classList.toggle('on',on);
  });
}
function toggleStretch(sid){const k=S.sessKey;if(!DB.sessions[k].stretch)DB.sessions[k].stretch={};const c=DB.sessions[k].stretch[sid]||{};DB.sessions[k].stretch[sid]={...c,done:!c.done};triggerSave();renderSOV();}
function updStretch(sid,field,val){const k=S.sessKey;if(!DB.sessions[k].stretch)DB.sessions[k].stretch={};if(sid==='_note'){DB.sessions[k].stretch.note=val;}else{if(!DB.sessions[k].stretch[sid])DB.sessions[k].stretch[sid]={};DB.sessions[k].stretch[sid][field]=val;}triggerSave();}
function setSessDate(v){DB.sessions[S.sessKey].date=v;triggerSave();}
function setSessDur(v){DB.sessions[S.sessKey].duration=parseInt(v)*60000;triggerSave();}
function setSessTod(v){DB.sessions[S.sessKey].timeOfDay=v;triggerSave();}
function finishSession(){
  const k=S.sessKey,sd=DB.sessions[k];
  if(!sd.duration&&S.sessionStart)sd.duration=Date.now()-S.sessionStart;
  sd.completed=true;if(!sd.date)sd.date=today();
  saveDB();S.sessStep='endphoto';renderSOV();
  document.getElementById('sov-body').scrollTop=0;
}
function deleteSession(key){if(!confirm('Delete this session permanently?'))return;delete DB.sessions[key];saveDB();closeSession();}

function savePhoto(){if(!S.photoData)return;if(!DB.progressPhotos)DB.progressPhotos=[];DB.progressPhotos.push({date:today(),sessionKey:S.sessKey,dataUrl:S.photoData,caption:S.photoCaption||''});triggerSave();const btn=document.querySelector('.pp .btn-g');if(btn){btn.textContent='✓ Saved!';btn.style.background='#888';btn.disabled=true;}}
function completeSess(){
  const sd=DB.sessions[S.sessKey];

}

function openExPicker(){

function filterExPicker(q){S.epQ=q;buildEpList(q);}
function setEpCat(c){S.epCat=c;buildEpCats();buildEpList(S.epQ||'');}
function buildEpCats(){
  const cats=document.getElementById('ep-cats');
  cats.innerHTML=['All',...EX_CATS].map(c=>`<button onclick="setEpCat('${c}')" style="border:1.5px solid ${S.epCat===c?'var(--r)':'var(--ln)'};background:${S.epCat===c?'var(--rb)':'transparent'};color:${S.epCat===c?'var(--r)':'var(--mid)'};border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap">${c}</button>`).join('');

function buildEpList(q){
  const sd=DB.sessions[S.sessKey]||{};
  const used=new Set(Object.keys(sd.exercises||{}));
  const ql=q.toLowerCase();
  const list=document.getElementById('expicker-list');
  let h='';let lastCat='';
  const filtered=EXERCISES.filter(ex=>(S.epCat==='All'||ex.cat===S.epCat)&&(!ql||ex.name.toLowerCase().includes(ql)||ex.muscles.join(' ').toLowerCase().includes(ql)));
  filtered.forEach(ex=>{
    if(ex.cat!==lastCat){h+=`<div class="ep-cat-hdr">${ex.cat}</div>`;lastCat=ex.cat;}
    const u=used.has(ex.id);
    // Use data-exid attribute and handle click via event delegation to avoid quote issues
    h+=`<div class="ep-item ${u?'':'ep-addable'}" data-exid="${ex.id}" style="opacity:${u?.6:1}">
      <div style="width:38px;height:38px;border-radius:50%;background:${u?'var(--ln)':'var(--r)'};display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${ex.emoji||'💪'}</div>
      <div style="flex:1"><div style="font-weight:700;font-size:14px;color:${u?'var(--lt)':'var(--dk)'}">${ex.name}</div><div style="font-size:11px;color:var(--lt);margin-top:1px">${ex.muscles.slice(0,2).join(' · ')}</div></div>
      <span style="font-size:${u?12:20}px;color:${u?'var(--lt)':'var(--r)'}">${u?'added':'+'}</span>
    </div>`;
  });
  if(!filtered.length||ql){
    h+=`<div class="ep-cat-hdr">CUSTOM</div>
    <div class="ep-item ep-custom">
      <div style="width:38px;height:38px;border-radius:50%;background:var(--bl);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">➕</div>
      <div style="flex:1"><div style="font-weight:700;font-size:14px;color:var(--dk)">Custom Exercise</div><div style="font-size:11px;color:var(--lt)">Add something not in the list</div></div>
    </div>`;
  }
  list.innerHTML=h;
  // Event delegation — no inline onclick with quotes
  list.onclick=function(e){
    const item=e.target.closest('.ep-addable');
    const custom=e.target.closest('.ep-custom');
    if(item){addExToSess(item.dataset.exid);}
    else if(custom){addCustomEx();}
  };
}
function addExToSess(exId){
  const k=S.sessKey;
  if(!DB.sessions[k].exercises)DB.sessions[k].exercises={};
  if(!DB.sessions[k].exercises[exId])DB.sessions[k].exercises[exId]={sets:[]};
  if(!DB.sessions[k].exOrder)DB.sessions[k].exOrder=Object.keys(DB.sessions[k].exercises);
  if(!DB.sessions[k].exOrder.includes(exId))DB.sessions[k].exOrder.push(exId);
  S.openSessEx.add(exId);
  closeExPicker();renderSOV();triggerSave();
  setTimeout(()=>{const el=document.getElementById('sec-'+exId);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},200);
}
function addCustomEx(){
  const name=prompt('Exercise name:');
  if(!name||!name.trim())return;
  const id='custom_'+name.trim().toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+Date.now();
  EXERCISES.push({id,emoji:'💪',name:name.trim(),cat:'Custom',type:'machine',muscles:['Custom']});
  addExToSess(id);
}

/* ═══════════════════════════════════════════════
   PLANK STOPWATCH
═══════════════════════════════════════════════ */
function swStart(){
  if(S.plankSW?.running)return;
  if(!S.plankSW)S.plankSW={running:false,elapsed:0};
  S.plankSW.running=true;
  S.plankSW.startedAt=Date.now()-(S.plankSW.elapsed||0)*1000;
  S.plankSW.itv=setInterval(()=>{
    S.plankSW.elapsed=Math.floor((Date.now()-S.plankSW.startedAt)/1000);
    const el=document.getElementById('sw-display');
    if(el){const s=S.plankSW.elapsed,m=Math.floor(s/60),sc=s%60;el.textContent=m>0?(m+'m '+String(sc).padStart(2,'0')+'s'):(String(sc)+'s');}
  },250);
  const btn=document.getElementById('plank-sw')?.querySelector('button');if(btn)btn.textContent='Running…';
}
function swStop(exId){
  if(!S.plankSW?.running)return;
  clearInterval(S.plankSW.itv);S.plankSW.running=false;
  const sec=S.plankSW.elapsed;if(sec<2){swReset();return;}
  const k=S.sessKey;
  if(!DB.sessions[k].exercises[exId])DB.sessions[k].exercises[exId]={sets:[]};
  const sets=DB.sessions[k].exercises[exId].sets;
  let slot=sets.findIndex(s=>!s.sec);
  if(slot<0){sets.push({sec:String(sec)});slot=sets.length-1;}
  else sets[slot].sec=String(sec);
  triggerSave();S.plankSW.elapsed=0;renderSOV();
}
function swReset(){clearInterval(S.plankSW?.itv);S.plankSW={running:false,elapsed:0};const el=document.getElementById('sw-display');if(el)el.textContent='0s';}

    // Cardio summary

        if(c.incline) line+=` · ${c.incline}%`;
        if(c.notes) line+=` · ${c.notes}`;
        cardioLines.push(line);
      }
    }

    // Plank summary
    const plankEd=s.exercises?.['plank'];
    const plankSecs=plankEd?.sets?.filter(st=>st.sec).map(st=>parseInt(st.sec)||0)||[];

    // Muscles
