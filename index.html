          </div>
          <div style="text-align:right">
            ${vol>0?`<div style="font-size:22px;font-weight:900;color:#fff">${Math.round(vol)}</div><div style="font-size:10px;color:#666;letter-spacing:.08em">kg×reps</div>`:''}
          </div>
        </div>
        ${ci?`<div style="margin-top:8px;padding-top:8px;border-top:1px solid #333;display:flex;gap:14px;flex-wrap:wrap">
          ${[{k:'energy',e:'⚡'},{k:'sleep',e:'😴'},{k:'mood',e:'😊'},{k:'stress',e:'😰'}].map(m=>`<span style="font-size:12px;color:#AAA">${m.e} ${ci[m.k]}/5</span>`).join('')}
          ${ci.pain?`<span style="font-size:12px;color:#FF6B6B">⚠️ ${ci.painNote||'pain noted'}</span>`:''}
        </div>`:''}
      </div>

      ${cardioLines.length?`<div style="padding:10px 14px;background:#FAFAFA;border-bottom:1px solid var(--ln)">
        ${cardioLines.map(l=>`<div style="font-size:13px;color:var(--mid);padding:2px 0">${l}</div>`).join('')}
      </div>`:''}

      ${muscles.length?`<div style="padding:8px 14px;border-bottom:1px solid var(--ln)">
        ${muscles.map(m=>`<span class="muscle-chip">${m}</span>`).join('')}
      </div>`:''}

      ${Object.entries(s.exercises||{}).filter(([exId])=>getEx(exId)?.type!=='cardio').map(([exId,ed])=>{
        const ex=getEx(exId);if(!ex)return '';
        const sets=ed.sets||[];
        const isPlankEx=exId==='plank'||exId==='plank_side';
        const isBilateral=exId==='rear_kick';

        // Best weight this session
        const bestKg=isPlankEx?null:Math.max(0,...sets.map(st=>parseFloat(st.kg)||0))||null;
        const bestSec=isPlankEx?Math.max(0,...sets.map(st=>parseFloat(st.sec)||0))||null:null;

        // Delta vs prev session
        let delta='';
        if(prev){
          const prevEd=prev.exercises?.[exId];
          if(prevEd?.sets?.length){
            if(isPlankEx){
              const prevBest=Math.max(0,...(prevEd.sets||[]).map(st=>parseFloat(st.sec)||0));
              if(prevBest&&bestSec){const d=bestSec-prevBest;delta=d>0?`+${d}s`:(d<0?`${d}s`:'=');}
            } else {
              const prevBest=Math.max(0,...(prevEd.sets||[]).map(st=>parseFloat(st.kg)||0));
              if(prevBest&&bestKg){const d=+(bestKg-prevBest).toFixed(1);delta=d>0?`+${d}kg`:(d<0?`${d}kg`:'=');}
            }
          }
        }
        const deltaColor=delta.startsWith('+')?'var(--gr)':delta.startsWith('-')?'var(--r)':'var(--lt)';
        const deltaStyle=delta?`background:${delta.startsWith('+')?'var(--gb)':delta.startsWith('-')?'var(--rb)':'var(--bg)'};color:${deltaColor};border:1px solid ${delta.startsWith('+')?'var(--gr)':delta.startsWith('-')?'var(--r)':'var(--ln)'}`:null;

        // Set summary string
        let setStr='';
        if(isPlankEx) setStr=sets.filter(st=>st.sec).map(st=>st.sec+'s').join(' · ');
        else if(isBilateral) setStr=sets.filter(st=>st.kg||st.rdx).map(st=>`${st.kg||'?'}kg·${st.rdx||'?'}dx/${st.rsx||'?'}sx`).join(' / ');
        else setStr=sets.filter(st=>st.kg||st.reps).map(st=>`${st.kg||'?'}×${st.reps||'?'}`).join(' · ');

        // Chips
        const chips=ed.chips?ed.chips.split(',').filter(Boolean):[];

        return `<div class="recap-ex">
          <span style="font-size:18px;flex-shrink:0">${ex.emoji||'💪'}</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:13px;color:var(--dk)">${ex.name}</div>
            <div style="font-size:11px;color:var(--lt);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${setStr||'—'}</div>
            ${chips.length?`<div style="margin-top:3px">${chips.map(c=>`<span style="font-size:10px;padding:1px 6px;border-radius:8px;background:${NOTE_CHIPS_POS.includes(c)?'var(--gb)':'var(--rb)'};color:${NOTE_CHIPS_POS.includes(c)?'var(--gr)':'var(--r)'};margin-right:3px">${c}</span>`).join('')}</div>`:''}
            ${ed.note?`<div style="font-size:11px;color:var(--mid);margin-top:2px;font-style:italic">${ed.note}</div>`:''}
          </div>
          ${delta?`<span class="recap-delta" style="${deltaStyle}">${delta}</span>`:''}
        </div>`;
      }).join('')}

      ${stretchDone>0?`<div style="padding:8px 14px;background:var(--gb);border-top:1px solid #A7F3D0">
        <span style="font-size:12px;font-weight:700;color:var(--gr)">🧘 Stretch: ${stretchDone}/${STRETCH_DEF.length} done${s.stretch?.note?' · '+s.stretch.note:''}</span>
      </div>`:''}
    </div>`;
  });

  h+=`</div>`;
  return h;
}

/* ═══════════════════════════════════════════════
   PROGRESS TAB
═══════════════════════════════════════════════ */
function renderProgress(){
  const all=getAllSessions(),done=getCompletedSessions();
  let h=`<div class="ph"><div class="lbl">Training Log</div><h1>Progress</h1></div><div class="pb">`;
  if(!done.length){h+=`<div style="text-align:center;padding:40px 20px;color:var(--lt)"><div style="font-size:48px;margin-bottom:12px">📊</div><p>Complete your first session to see progress.</p></div></div>`;return h;}
  const totalVol=done.reduce((acc,s)=>{for(const ed of Object.values(s.exercises||{}))for(const set of(ed.sets||[]))acc+=(parseFloat(set.kg)||0)*(parseFloat(set.reps)||0);return acc;},0);
  h+=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">
    <div style="background:var(--bl);border-radius:8px;padding:10px;text-align:center"><div style="font-size:9px;color:#AAA;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px">Sessions</div><div style="color:#fff;font-weight:700;font-size:20px">${done.length}</div></div>
    <div style="background:var(--bl);border-radius:8px;padding:10px;text-align:center"><div style="font-size:9px;color:#AAA;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px">Volume</div><div style="color:#fff;font-weight:700;font-size:16px">${Math.round(totalVol/1000)}k kg</div></div>
    <div style="background:var(--bl);border-radius:8px;padding:10px;text-align:center"><div style="font-size:9px;color:#AAA;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px">Streak</div><div style="color:#fff;font-weight:700;font-size:20px">${getStreak()} 🔥</div></div>
  </div>`;
  h+=`<div class="sl">ALL SESSIONS</div>`;
  [...all].reverse().forEach(s=>{
    const d=s.completed;
    const exNames=Object.keys(s.exercises||{}).map(id=>getEx(id)?.name||id).slice(0,3).join(', ')+(Object.keys(s.exercises||{}).length>3?'…':'');
    let vol=0;for(const ed of Object.values(s.exercises||{}))for(const set of(ed.sets||[]))vol+=(parseFloat(set.kg)||0)*(parseFloat(set.reps)||0);
    const muscles=getMusclesSummary(s.exercises||{}).slice(0,4);
    h+=`<div onclick="openExistingSession('${s.key}')" style="background:var(--wh);border-radius:12px;border:1.5px solid ${d?'var(--ln)':'#EEE'};padding:12px 14px;margin-bottom:6px;cursor:pointer">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:36px;height:36px;border-radius:50%;background:${d?'var(--gr)':'var(--lt)'};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;flex-shrink:0">${d?s.num:'+'}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px;color:var(--dk)">Session ${s.num}${!d?' <span style="font-size:11px;color:var(--lt);font-weight:400">· tap to log</span>':''}</div>
          <div style="font-size:11px;color:var(--lt);margin-top:1px">${fmtDate(s.date)}${s.duration?' · '+fmtDur(s.duration):''}${vol>0?' · '+Math.round(vol)+' kg×r':''}</div>
          ${exNames?`<div style="font-size:11px;color:var(--mid);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${exNames}</div>`:''}
        </div>
        <span style="color:var(--lt);font-size:16px">→</span>
      </div>
      ${muscles.length&&d?`<div style="margin-top:6px">${muscles.map(m=>`<span class="muscle-chip">${m}</span>`).join('')}</div>`:''}
    </div>`;
  });
  // Wellbeing chart
  const wbSessions=done.filter(s=>s.checkin).slice(-20);
  if(wbSessions.length>=2){
    h+=`<div class="sl" style="margin-top:14px">WELLBEING OVER TIME</div>`;
    const WB_METRICS=[
      {k:'energy',label:'Energy',color:'#F59E0B'},
      {k:'sleep', label:'Sleep', color:'#3B82F6'},
      {k:'mood',  label:'Mood',  color:'#8B5CF6'},
      {k:'stress',label:'Stress',color:'#EF4444'},
    ];
    WB_METRICS.forEach(m=>{
      const vals=wbSessions.map(s=>({v:s.checkin[m.k]||0,date:s.date,num:s.num}));
      const maxV=5;
      h+=`<div style="background:var(--wh);border-radius:10px;border:1px solid var(--ln);padding:10px 14px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-weight:700;font-size:13px;color:var(--dk)">${m.label}</span>
          <span style="font-size:12px;color:var(--lt)">avg ${(vals.reduce((a,b)=>a+b.v,0)/vals.length).toFixed(1)}/5</span>
        </div>
        <div class="wb-chart">
          ${vals.map(v=>{
            const h2=Math.round((v.v/maxV)*38)+4;
            const alpha=0.4+((v.v-1)/4)*0.6;
            return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0">
              <div style="font-size:8px;color:var(--lt);font-weight:600">${v.v}</div>
              <div class="wb-bar" style="height:${h2}px;background:${m.color};opacity:${alpha.toFixed(2)};width:100%"></div>
              <div class="wb-label">${fmtDate(v.date).replace(' ','&nbsp;')}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    });
  }
  const exProgress={};
  done.forEach(s=>{
    for(const[exId,ed]of Object.entries(s.exercises||{})){
      const ex=getEx(exId);
      if(ex?.type==='cardio')continue;
      if(!exProgress[exId])exProgress[exId]=[];
      const isPlankEx=exId==='plank'||exId==='plank_side';
      if(isPlankEx){
        const bestSec=Math.max(0,...(ed.sets||[]).map(st=>parseFloat(st.sec)||0));
        if(bestSec>0)exProgress[exId].push({num:s.num,val:bestSec,label:bestSec+'s',unit:'sec'});
      } else {
        const maxKg=Math.max(0,...(ed.sets||[]).map(st=>parseFloat(st.kg)||0));
        if(maxKg>0)exProgress[exId].push({num:s.num,val:maxKg,label:maxKg+'kg',unit:'kg'});
      }
    }
  });
  const multiSess=Object.entries(exProgress).filter(([,v])=>v.length>=2);
  if(multiSess.length){
    h+=`<div class="sl" style="margin-top:14px">WEIGHT PROGRESSION</div>`;
    multiSess.forEach(([exId,vals])=>{
      const ex=getEx(exId);const name=(ex||{}).name||exId;
      const maxV=Math.max(...vals.map(v=>v.val));
      const diff=vals[vals.length-1].val-vals[0].val;
      const unit=vals[0].unit;
      const diffStr=unit==='sec'?(diff>0?'+'+diff+'s':diff+'s'):(diff>0?'+'+diff.toFixed(1)+'kg':diff.toFixed(1)+'kg');
      h+=`<div style="background:var(--wh);border-radius:10px;border:1px solid var(--ln);padding:10px 14px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:16px">${ex?.emoji||'💪'}</span>
            <div><div style="font-weight:700;font-size:13px;color:var(--dk)">${name}</div><div style="font-size:12px;color:var(--mid)">${vals[0].label} → ${vals[vals.length-1].label}</div></div>
          </div>
          ${diff>0?`<span class="chip" style="background:var(--gb);border-color:var(--gr);color:var(--gr)">${diffStr} ↑</span>`:''}
        </div>
        <div class="barchart-wrap">${vals.map((v,i)=>{const hh=maxV>0?Math.round((v.val/maxV)*42)+4:4;return`<div class="bar-col"><div class="bar-val">${v.label}</div><div class="bar-body ${i===vals.length-1?'last':''}" style="height:${hh}px"></div></div>`;}).join('')}</div>
      </div>`;
    });
  }
  h+=`</div>`;return h;
}

/* ═══════════════════════════════════════════════
   BODY TAB
═══════════════════════════════════════════════ */
function renderBody(){
  const latest=DB.bodyLogs?.length?DB.bodyLogs[DB.bodyLogs.length-1]:{};
  const photos=DB.progressPhotos||[];
  let h=`<div class="ph"><div class="lbl">Body</div><h1>Body Metrics</h1></div><div class="pb">`;
  h+=`<div class="card" style="padding:16px;margin-bottom:12px">
    <div class="sl" style="padding-top:0">UPDATE METRICS</div>
    ${[{k:'weight',l:'Weight',u:'kg'},{k:'body_fat',l:'Body Fat',u:'%'},{k:'muscle_mass',l:'Muscle Mass',u:'kg'},{k:'waist',l:'Waist',u:'cm'},{k:'hips',l:'Hips',u:'cm'}].map(m=>`<div class="mr"><div class="ml">${m.l}</div><input type="number" class="mv" inputmode="decimal" step="0.1" value="${latest[m.k]||''}" placeholder="—" onchange="S.bodyDraft['${m.k}']=this.value"><div class="mu">${m.u}</div></div>`).join('')}
    <button class="btn btn-r" onclick="saveMetrics()" style="margin-top:14px">Save Today's Metrics</button>
  </div>`;
  if(DB.bodyLogs?.length>1){
    const ws=DB.bodyLogs.filter(l=>l.weight).map(l=>({d:l.date,v:parseFloat(l.weight)}));
    if(ws.length>1){const mx=Math.max(...ws.map(w=>w.v)),mn=Math.min(...ws.map(w=>w.v)),rng=mx-mn||1;h+=`<div style="background:var(--wh);border-radius:12px;border:1px solid var(--ln);padding:12px 14px;margin-bottom:12px"><div class="sl" style="padding-top:0">WEIGHT TREND</div><div class="barchart-wrap">${ws.slice(-12).map((w,i,arr)=>{const hh=Math.round(((w.v-mn)/rng)*40)+4;return`<div class="bar-col"><div class="bar-val">${w.v}</div><div class="bar-body ${i===arr.length-1?'last':''}" style="height:${hh}px"></div></div>`;}).join('')}</div></div>`;}
  }
  h+=`<div class="card" style="padding:16px;margin-bottom:12px">
    <div class="sl" style="padding-top:0">PROGRESS PHOTOS</div>
    <button class="btn btn-bl" onclick="document.getElementById('photo-input').click();S.photoCallback='standalone'" style="margin-bottom:${photos.length?'12px':'0'}">📷 Add Progress Photo</button>
    ${photos.length>=2?renderPhotoComp(photos):''}
  </div>`;
  h+=`<div style="display:flex;gap:8px;margin-bottom:12px">
    <button class="btn btn-bl" onclick="exportData()" style="flex:1;font-size:13px;padding:12px">Export JSON</button>
    <button class="btn" style="flex:1;font-size:13px;padding:12px;background:var(--bg);border:1.5px solid var(--ln);color:var(--dk)" onclick="document.getElementById('import-input').click()">Import JSON</button>
  </div></div>`;
  return h;
}
function saveMetrics(){if(!DB.bodyLogs)DB.bodyLogs=[];const e={date:today(),...S.bodyDraft};const idx=DB.bodyLogs.findIndex(l=>l.date===today());if(idx>=0)DB.bodyLogs[idx]={...DB.bodyLogs[idx],...e};else DB.bodyLogs.push(e);S.bodyDraft={};triggerSave();renderApp();}
function renderPhotoComp(photos){if(photos.length<2)return '';const a=photos[0],b=photos[photos.length-1];return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><div><div style="font-size:10px;font-weight:700;color:var(--lt);margin-bottom:4px">BEFORE · ${fmtDate(a.date)}</div><img src="${a.dataUrl}" style="width:100%;border-radius:8px;aspect-ratio:3/4;object-fit:cover"></div><div><div style="font-size:10px;font-weight:700;color:var(--gr);margin-bottom:4px">NOW · ${fmtDate(b.date)}</div><img src="${b.dataUrl}" style="width:100%;border-radius:8px;aspect-ratio:3/4;object-fit:cover"></div></div>`;}
function exportData(){const d=JSON.parse(JSON.stringify(DB));if(d.progressPhotos)d.progressPhotos=d.progressPhotos.map(p=>({...p,dataUrl:'[photo excluded]'}));const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(d,null,2));a.download='teodora_'+today()+'.json';a.click();}
function importData(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.sessions){alert('Invalid file.');return;}if(!confirm('Import this data? Current data will be replaced.'))return;DB=d;saveDB();renderApp();alert('Import successful!');}catch(err){alert('Error: '+err.message);}};reader.readAsText(file);input.value='';}

/* ═══════════════════════════════════════════════
   NOTES TAB
═══════════════════════════════════════════════ */
function renderNotes(){
  const done=getCompletedSessions();
  let h=`<div class="ph"><div class="lbl">Session Notes</div><h1>Notes</h1></div><div class="pb">`;
  if(!done.length){h+=`<div style="text-align:center;padding:40px 20px;color:var(--lt)"><p>No sessions yet.</p></div></div>`;return h;}
  let hasAny=false;
  [...done].reverse().forEach(s=>{
    const exEntries=Object.entries(s.exercises||{});
    const hasNotes=exEntries.some(([,ed])=>ed.note||ed.chips);
    const stretchDone=STRETCH_DEF.filter(st=>s.stretch?.[st.id]?.done).length;
    const ci=s.checkin;
    if(!hasNotes&&!stretchDone&&!s.stretch?.note&&!ci)return;
    hasAny=true;
    h+=`<div style="background:var(--wh);border-radius:12px;border:1.5px solid var(--ln);padding:14px 16px;margin-bottom:10px">
      <div style="font-weight:700;font-size:15px;color:var(--bl);margin-bottom:2px">Session ${s.num} · ${fmtDate(s.date)}</div>
      ${s.duration?`<div style="font-size:11px;color:var(--lt);margin-bottom:8px">${fmtDur(s.duration)}</div>`:''}
      ${ci?`<div style="background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:12px;color:var(--mid)">
        <span style="font-weight:700;color:var(--lt)">PRE-TRAINING: </span>⚡${ci.energy} 😴${ci.sleep} 😊${ci.mood} 😰${ci.stress}${ci.pain?' · ⚠️ '+ci.painNote:''}
      </div>`:''}`;
    exEntries.forEach(([exId,ed])=>{
      if(!ed.note&&!ed.chips)return;
      const ex=getEx(exId);const chips=ed.chips?ed.chips.split(',').filter(Boolean):[];
      h+=`<div style="margin-bottom:8px"><div style="font-size:12px;font-weight:700;color:var(--mid);margin-bottom:4px">${ex?.name||exId}</div>
        ${chips.length?`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px">${chips.map(c=>`<span style="background:${NOTE_CHIPS_POS.includes(c)?'var(--gb)':'var(--rb)'};border:1px solid ${NOTE_CHIPS_POS.includes(c)?'var(--gr)':'var(--r)'};color:${NOTE_CHIPS_POS.includes(c)?'var(--gr)':'var(--r)'};border-radius:12px;padding:2px 8px;font-size:11px;font-weight:600">${c}</span>`).join('')}</div>`:''}
        ${ed.note?`<div style="font-size:13px;color:var(--dk)">${ed.note}</div>`:''}
      </div>`;
    });
    if(stretchDone>0||s.stretch?.note){
      h+=`<div style="border-top:1px solid var(--ln);margin-top:8px;padding-top:8px">
        <div style="font-size:12px;font-weight:700;color:var(--gr);margin-bottom:4px">🧘 Stretch: ${stretchDone}/${STRETCH_DEF.length} done</div>
        ${s.stretch?.note?`<div style="font-size:13px;color:var(--dk)">${s.stretch.note}</div>`:''}
      </div>`;
    }
    h+=`</div>`;
  });
  if(!hasAny)h+=`<div style="text-align:center;padding:30px;color:var(--lt)">No notes recorded yet.<br>Add notes during sessions.</div>`;
  h+=`</div>`;return h;
}

/* ═══════════════════════════════════════════════
   CELEBRATION
═══════════════════════════════════════════════ */
const CEL_MSGS=[
  'Every rep counts. Every session matters. You showed up again.',
  'Progress is not always visible, but it is always happening.',
  'Consistent effort compounds. You are building something real.',
  'The body you want is built one session at a time. This was one.',
  'Discipline is the bridge between goals and results. Keep crossing it.',
];
function showCelebration(sd,vol,prs){
  const total=getCompletedSessions().length;
  const muscles=getMusclesSummary(sd.exercises||{});
  document.getElementById('cel-title').textContent=total===1?'First session done!':prs.length?'New personal record!':'Session complete!';
  document.getElementById('cel-sub').textContent=fmtDate(sd.date)+(sd.duration?' · '+fmtDur(sd.duration):'');
  document.getElementById('cv1').textContent=fmtDur(sd.duration);
  document.getElementById('cv2').textContent=Math.round(vol)||'—';
  document.getElementById('cv3').textContent=prs.length||'—';
  document.getElementById('cv3').style.color=prs.length?'#FFD700':'#fff';
  document.getElementById('cel-muscles').innerHTML=muscles.length?`<div style="margin-bottom:4px;font-size:10px;font-weight:700;color:#666;letter-spacing:.1em;text-transform:uppercase">MUSCLES TRAINED</div>`+muscles.map(m=>`<span style="display:inline-block;background:#2A2A2A;border:1px solid #444;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:600;color:#DDD;margin:2px">${m}</span>`).join(''):'';
  const prsEl=document.getElementById('cel-prs');
  prsEl.innerHTML=prs.length?`<div style="background:#1A1000;border:1px solid #FFD700;border-radius:10px;padding:10px 14px">${prs.map(n=>`<div style="font-size:13px;color:#FFD700;padding:2px 0">🏆 ${n}</div>`).join('')}</div>`:'';
  document.getElementById('cel-msg').textContent=total===1?'Every expert started exactly here. The hardest part was showing up — and you did.':prs.length?'A new personal record. That is not luck, it is consistent effort.':CEL_MSGS[total%CEL_MSGS.length];
  document.getElementById('cel').classList.add('show');
  showConfetti();
}
function closeCelebration(){document.getElementById('cel').classList.remove('show');renderApp();}

/* ═══════════════════════════════════════════════
   TIMER
═══════════════════════════════════════════════ */
const CIRC=2*Math.PI*26;
function startTimer(secs){stopTimer();S.timerSecs=secs;S.timerDur=secs;S.timerOn=true;document.getElementById('timer-ov').classList.add('show');updTimerUI();S.timerItv=setInterval(()=>{S.timerSecs--;if(S.timerSecs<=0){stopTimer();beep();}else updTimerUI();},1000);}
function updTimerUI(){const tn=document.getElementById('tn'),tpg=document.getElementById('tpg');if(tn)tn.textContent=S.timerSecs;if(tpg){const pct=S.timerSecs/S.timerDur,off=CIRC*(1-pct);tpg.style.strokeDasharray=CIRC;tpg.style.strokeDashoffset=off;}}
function stopTimer(){clearInterval(S.timerItv);S.timerOn=false;S.timerSecs=0;const ov=document.getElementById('timer-ov');if(ov)ov.classList.remove('show');}
function skipTimer(){stopTimer();}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(0.3,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.6);o.start(c.currentTime);o.stop(c.currentTime+0.6);}catch(e){}}

/* ═══════════════════════════════════════════════
   PR BANNER + CONFETTI
═══════════════════════════════════════════════ */
function showPR(exId,kg){const prb=document.getElementById('prb'),t=document.getElementById('prb-text');if(t){const ex=getEx(exId);t.textContent='New PR! '+(ex?ex.name:exId)+': '+kg+' kg 🏆';}prb.classList.add('show');showConfetti();setTimeout(()=>prb.classList.remove('show'),3200);}
function showConfetti(){const cnv=document.getElementById('cnv');cnv.width=cnv.offsetWidth;cnv.height=cnv.offsetHeight;const ctx=cnv.getContext('2d');const p=[];for(let i=0;i<80;i++)p.push({x:Math.random()*cnv.width,y:-10,vy:2+Math.random()*4,vx:(Math.random()-.5)*3,color:['#C8000A','#FFD700','#1A7F3C','#3B82F6','#F59E0B'][Math.floor(Math.random()*5)],size:4+Math.random()*6,angle:Math.random()*Math.PI*2,spin:(.02+Math.random()*.04)*(Math.random()>.5?1:-1)});let fr=0;const loop=()=>{ctx.clearRect(0,0,cnv.width,cnv.height);p.forEach(pt=>{pt.y+=pt.vy;pt.x+=pt.vx;pt.vy+=.05;pt.angle+=pt.spin;ctx.save();ctx.translate(pt.x,pt.y);ctx.rotate(pt.angle);ctx.fillStyle=pt.color;ctx.fillRect(-pt.size/2,-pt.size/2,pt.size,pt.size);ctx.restore();});fr++;if(fr<120)requestAnimationFrame(loop);else ctx.clearRect(0,0,cnv.width,cnv.height);};loop();}

/* ═══════════════════════════════════════════════
   PHOTO
═══════════════════════════════════════════════ */
function handlePhoto(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{compressImg(e.target.result,800,url=>{S.photoData=url;if(S.photoCallback==='session')renderSOV();else if(S.photoCallback==='standalone')renderApp();});};reader.readAsDataURL(file);input.value='';}
function compressImg(dataUrl,maxW,cb){const img=new Image();img.onload=()=>{const r=Math.min(1,maxW/img.width);const c=document.createElement('canvas');c.width=img.width*r;c.height=img.height*r;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.75));};img.src=dataUrl;}

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
renderApp();
goTab('workout');
</script>
